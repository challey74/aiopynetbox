name: Regenerate endpoints

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run python scripts/generate_endpoints.py
      - run: uv run ruff format src/aiopynetbox/apps.py src/aiopynetbox/hints.pyi
      - run: uv run pyright
      - run: uv run pytest
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: regenerate endpoint hints from demo.netbox.dev"
          title: "chore: regenerate endpoint hints"
          body: >
            Automated regeneration of the typed endpoint hints in
            src/aiopynetbox/apps.py from demo.netbox.dev's OpenAPI schema.
            A diff here usually means a new NetBox release added or removed
            endpoints.
          branch: regenerate-endpoints
          delete-branch: true
