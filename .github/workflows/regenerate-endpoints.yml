name: Regenerate endpoints

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run python scripts/generate_endpoints.py
      - run: uv run ruff format src/aiopynetbox/apps_generated.py src/aiopynetbox/hints_generated.pyi
      - run: uv run pyright
      - run: uv run pytest
      - id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: regenerate endpoint hints from demo.netbox.dev"
          title: "chore: regenerate endpoint hints"
          body: >
            Automated regeneration of the typed endpoint hints in
            src/aiopynetbox/apps_generated.py from demo.netbox.dev's OpenAPI schema.
            A diff here usually means a new NetBox release added or removed
            endpoints.
          branch: regenerate-endpoints
          delete-branch: true
      # A PR opened with GITHUB_TOKEN doesn't trigger pull_request workflows,
      # but workflow_dispatch is exempt, and its checks land on the PR head.
      - if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh workflow run ci.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
