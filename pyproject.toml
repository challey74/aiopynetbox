[project]
name = "apynetbox"
version = "0.1.0"
description = "Fully async NetBox API client built on httpx"
readme = "README.md"
authors = [
    { name = "Cody Halley", email = "cody.m.halley@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["netbox", "async", "asyncio", "httpx", "api", "client", "ipam", "dcim"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
]

[project.urls]
Repository = "https://github.com/challey74/apynetbox"
Changelog = "https://github.com/challey74/apynetbox/blob/main/CHANGELOG.md"
Issues = "https://github.com/challey74/apynetbox/issues"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
